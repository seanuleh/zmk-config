---
# George's Sofle: no dongle, no displays, no LEDs.
# Left half is the central and talks to the host directly.
include:
  - board: nice_nano/nrf52840/zmk
    shield: sofled_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
  - board: nice_nano/nrf52840/zmk
    shield: sofled_right
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
