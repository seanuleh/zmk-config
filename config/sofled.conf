# Bluetooth Power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Debounce — default 5ms is too fast for some switches, causes double presses
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# BLE peripheral connection interval — tighter range keeps latency consistent
# and reduces the window for duplicate event delivery under interference
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y

# Display Config
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y