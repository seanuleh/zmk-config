CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=275
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10

# Custom portrait status screen (Claude critter). Suppresses nice_view's
# own widget so ours wins; LVGL widget set enabled explicitly because
# nice_view normally selects them via its widget option.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_SOFLED_CUSTOM_STATUS_SCREEN=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y

# Built-in widgets off on the halves — our custom screen replaces them.
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
