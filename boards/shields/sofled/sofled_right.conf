# No batteries: left runs off USB and feeds the right half 3.3V over the
# TRRS cable (from the nice!nano's switched VCC pin). Never sleep, or the
# right half would power off and need a keypress to come back.
CONFIG_ZMK_SLEEP=n

# Keeps the VCC pin switched on. Left: it powers the right half. Right:
# without it, the feed reaches the 3.3V rail through the switch's body diode.
CONFIG_ZMK_EXT_POWER=y
