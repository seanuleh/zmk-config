CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=275
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_LAYER_REPORT=y
# ZMK occupies HID_0; layer-report needs HID_1
CONFIG_USB_HID_DEVICE_COUNT=2

# Keep OLED rendering off the system workqueue. Without nice_view in the
# shield list the display defaults to the system queue, where an I2C flush
# blocks incoming split key events, hold-tap timers and BT TX — late
# releases then turn auto-shift taps into capitals.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10

# Peripheral key-event queue (default 5). Overflow silently drops a press
# or release; 16 rides out a burst from both halves during a stall.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=16

# No battery on the dongle. The nrfmicro's BAT pin floats on the charger
# output, so the ADC reading was meaningless (it jumped to 0%). Turn off
# battery sampling and the battery widget here.
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n

# Custom screen: built-in output + layer widgets, plus a split-link panel
# (per-half RSSI, drop count, last drop reason) in place of battery.
# Fonts listed because the built-in screen normally defaults them.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_UNSCII_8=y
# LVGL heap. ZMK only defaults this to 4096 for the built-in screen; with a
# custom screen it falls to 2048, which the screen + link panel overflow,
# leaving the dongle hung at boot (OLED frozen on the old image, no split).
CONFIG_LV_Z_MEM_POOL_SIZE=8192
# Low-prio queue now also runs the panel's synchronous HCI RSSI reads.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1536

# USB-only dongle: never advertise to BLE hosts, so the radio is spent only
# on the two split links (needs the patched zmk with this option).
CONFIG_ZMK_BLE_HOST_ADVERTISING=n
